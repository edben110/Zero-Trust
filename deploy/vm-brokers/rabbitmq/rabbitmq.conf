# Autenticacion y autorizacion solo con el JWT de auth_server (sin usuarios locales).
listeners.tcp.default = 5672
default_vhost = votacion

auth_backends.1 = oauth2

# Debe coincidir con el claim aud del token y con el prefijo de los scopes (rabbitmq.read:...).
auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.jwks_url = https://vm-auth:443/.well-known/jwks.json
auth_oauth2.algorithms.1 = RS256

# TLS hacia auth_server para leer el JWKS. ca.pem es el certificado/CA que firma tls.p12.
auth_oauth2.https.cacertfile = /etc/rabbitmq/certs/ca.pem
auth_oauth2.https.peer_verification = verify_peer
auth_oauth2.https.hostname_verification = wildcard
