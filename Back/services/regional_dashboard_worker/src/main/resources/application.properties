spring.application.name=regional-dashboard-worker
server.port=${SERVER_PORT:8081}

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:https://vm-auth:443/.well-known/jwks.json}

rabbit.exchange.live-results-regional=live_results_regional

# "#" = todas las regiones. Cambiar a "norte", "sur", etc. para un worker dedicado.
dashboard.region-binding=#
