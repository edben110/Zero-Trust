spring.application.name=analytics-archiver
spring.main.web-application-type=none
spring.main.banner-mode=off

# PostgreSQL: sin valores por defecto; el esquema lo crea docs/schema.sql y aquí solo se valida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mismo group.id en todas las réplicas: cada voto lo procesa una sola instancia.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.consumer.group-id=analytics-archiver
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# El offset se confirma por registro y solo después de guardar el voto.
spring.kafka.listener.ack-mode=record

archivo.topic=raw_votes
