spring.application.name=bot-detector-service

# Kafka consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=bot-detector-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka producer (para security_alerts)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka SASL/OAUTHBEARER
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=OAUTHBEARER
spring.kafka.properties.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler
spring.kafka.properties.sasl.oauthbearer.token.endpoint.url=${AUTH_TOKEN_URL:https://vm-auth:443/token}
spring.kafka.properties.sasl.login.refresh.buffer.seconds=30

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zerotrust}
spring.datasource.username=${DB_USER:zerotrust}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:https://vm-auth:443/.well-known/jwks.json}

# Umbrales de detección
detector.suspicious-threshold=5
detector.blocked-threshold=10
detector.window-seconds=60

kafka.topic.raw-votes=raw_votes
kafka.topic.security-alerts=security_alerts
