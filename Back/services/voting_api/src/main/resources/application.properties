spring.application.name=voting-api
spring.main.banner-mode=off

server.port=8080
server.error.include-stacktrace=never
spring.web.resources.add-mappings=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# Kafka: se espera la confirmación del broker antes de responder 200.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# RabbitMQ: sin usuario ni contraseña; las credenciales son el token de auth_server (ConfiguracionRabbitOAuth).
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}
spring.rabbitmq.template.reply-timeout=${RPC_TIMEOUT_MS:3000}

votacion.topic=raw_votes
# Pruebas controladas de seguridad desde el panel: bot_detector_service las
# consume y aplica el patrón State con la IP indicada.
seguridad.drills-topic=security_drills
seguridad.suspicious-threshold=5
seguridad.blocked-threshold=10
seguridad.window-seconds=60
# Altas en el padrón desde el panel de administración (mismo topic que voter_registration_service).
votacion.topic-padron=eligible_voters
votacion.cola-validacion=user_validation_queue
votacion.publicacion-timeout-ms=5000

# PostgreSQL: voto unico por elección (tabla voter_election_usage de docs/schema.sql). Sin valores por defecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Con la base caida se responde 503 pronto en vez de esperar 30 s.
spring.datasource.hikari.connection-timeout=3000
