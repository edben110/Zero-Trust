spring.application.name=voter-registration-service
spring.main.web-application-type=none
spring.main.banner-mode=off

# PostgreSQL: sin valores por defecto; el esquema lo crea docs/schema.sql y aquí solo se valida.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=10000

registro.topic=eligible_voters
registro.publicacion-timeout-ms=10000
