spring.application.name=user-validation-service
spring.main.web-application-type=none
spring.main.banner-mode=off

# Kafka: cada instancia necesita el topic completo, así que usa un group.id propio y lee desde el principio.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.consumer.group-id=user-validation-service-${random.uuid}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# RabbitMQ: sin usuario ni contraseña; las credenciales son el token de auth_server (ConfiguracionRabbitOAuth).
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}

validacion.cola=user_validation_queue
padron.topic=eligible_voters
